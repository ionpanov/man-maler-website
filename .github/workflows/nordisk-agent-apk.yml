name: Build Nordisk Agent test APK
on:
  push:
    branches: ["build/nordisk-agent-android-20261009"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon -p nordisk-agent-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Nordisk-Agent-APK
          path: nordisk-agent-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
